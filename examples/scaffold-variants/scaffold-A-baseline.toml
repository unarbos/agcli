# container=agcli_parity_A port=9971 expected_subnets=1 expected_neurons=3 post_scaffold_sudo=none
[chain]
image = "ghcr.io/opentensor/subtensor-localnet:devnet-ready"
container = "agcli_parity_A"
port = 9971
start = true
timeout = 120

[[subnet]]
tempo = 100
max_allowed_validators = 8
min_allowed_weights = 1
weights_rate_limit = 0
commit_reveal = false

[[subnet.neuron]]
name = "validator1"
fund_tao = 1000.0
register = true

[[subnet.neuron]]
name = "miner1"
fund_tao = 100.0
register = true

[[subnet.neuron]]
name = "miner2"
fund_tao = 100.0
register = true
