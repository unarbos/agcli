# container=agcli_parity_B port=9972 expected_subnets=1 expected_neurons=3 post_scaffold_sudo="sudo target/release/agcli admin raw --call sudo_set_commit_reveal_weights_interval --args '[1,1]' --sudo-key //Alice --endpoint ws://127.0.0.1:9972 --output json"
[chain]
image = "ghcr.io/opentensor/subtensor-localnet:devnet-ready"
container = "agcli_parity_B"
port = 9972
start = true
timeout = 120

[[subnet]]
tempo = 100
max_allowed_validators = 8
min_allowed_weights = 1
weights_rate_limit = 0
commit_reveal = true

[[subnet.neuron]]
name = "validator1"
fund_tao = 1000.0
register = true

[[subnet.neuron]]
name = "miner1"
fund_tao = 100.0
register = true

[[subnet.neuron]]
name = "miner2"
fund_tao = 100.0
register = true
